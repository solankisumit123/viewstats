# supabase/config.toml
# Supabase local development & Edge Functions configuration.
# See: https://supabase.com/docs/guides/functions/deploy#config-toml

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["https://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# ---------------------------------------------------------------------------
# Edge Functions
# ---------------------------------------------------------------------------

# youtube-proxy uses "publishable" auth mode (no user JWT required).
# verify_jwt must be false for any function NOT using auth: "user".
[functions.youtube-proxy]
verify_jwt = false
